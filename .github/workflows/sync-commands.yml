name: Sync Claude Code commands

on:
  workflow_dispatch:
 # schedule:
 #   - cron: "0 5 * * *" # 8 AM Egypt time

concurrency:
  group: sync-claude-commands
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save old commands
        run: cp data/commands.json /tmp/old-commands.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Sync commands
        run: npm run sync:commands

      - name: Check if commands changed
        id: changes
        run: |
          if git diff --quiet data/commands.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack for new commands
        if: steps.changes.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/check-and-notify.js

      - name: Commit updated command catalog
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commands.json
          git commit -m "chore: sync Claude Code commands"
          git push
